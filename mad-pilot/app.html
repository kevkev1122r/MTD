<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backdoor Scanner</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #16181d; --muted: #5d6470; --line: #e3e6eb; --soft: #eef0f3;
  --accent: #2f5bd3; --accent-ink: #ffffff; --bad: #d23c2f; --bad-soft: #fbe6e3; --good: #1f8a4c; --good-soft: #e3f4ea;
  --hl: 210, 60, 47; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --panel: #1a1d23; --ink: #e8eaee; --muted: #9aa2ae; --line: #2b3038; --soft: #232730;
    --accent: #7c9cff; --accent-ink: #0d1020; --bad: #ff7a6b; --bad-soft: #3a1f1c; --good: #5fd08f; --good-soft: #17301f; --hl: 255, 110, 95;
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --panel: #1a1d23; --ink: #e8eaee; --muted: #9aa2ae; --line: #2b3038; --soft: #232730;
  --accent: #7c9cff; --accent-ink: #0d1020; --bad: #ff7a6b; --bad-soft: #3a1f1c; --good: #5fd08f; --good-soft: #17301f; --hl: 255, 110, 95;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; margin-bottom: 20px; }
h1 { font-size: 24px; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--muted); margin: 2px 0 0; font-size: 14px; }
label.sel { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
select, textarea, button { font: inherit; color: inherit; }
select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 280px; max-width: 100%; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
.card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
textarea { width: 100%; min-height: 84px; resize: vertical; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-family: var(--mono); font-size: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
button.go { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 9px 18px; font-weight: 600; cursor: pointer; }
button.go:disabled { opacity: .6; cursor: default; }
.chip { background: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 13px; cursor: pointer; }
.chip:hover { border-color: var(--accent); }
.hint { color: var(--muted); font-size: 13px; }
.verdict { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; font-weight: 600; }
.verdict.bad { background: var(--bad-soft); color: var(--bad); }
.verdict.good { background: var(--good-soft); color: var(--good); }
.verdict b { white-space: nowrap; }
.verdict small { font-weight: 400; color: var(--ink); opacity: .8; }
.det { border-top: 1px solid var(--line); padding: 12px 0; }
.det:first-of-type { border-top: 0; padding-top: 0; }
.dethead { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; margin-bottom: 6px; }
.dethead b { font-size: 15px; }
.tag { font-size: 11px; border-radius: 4px; padding: 1px 6px; background: var(--soft); color: var(--muted); }
.badge { font-size: 12px; font-weight: 600; border-radius: 4px; padding: 1px 7px; }
.badge.bad { background: var(--bad-soft); color: var(--bad); } .badge.good { background: var(--good-soft); color: var(--good); }
.detdesc { color: var(--muted); font-size: 12px; }
.toks { font-family: var(--mono); font-size: 14px; line-height: 1.9; white-space: pre-wrap; word-break: break-word; }
.toks span { border-radius: 3px; padding: 1px 0; }
.toks span.over { outline: 1.5px solid var(--bad); }
.outs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 700px) { .outs { grid-template-columns: 1fr; } select { min-width: 0; width: 100%; } }
.out { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.out .who { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.out .txt { font-family: var(--mono); font-size: 13px; white-space: pre-wrap; word-break: break-word; }
.out .txt .p { color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
td, th { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 500; }
td.mono { font-family: var(--mono); white-space: pre; }
.bar { height: 6px; background: var(--accent); border-radius: 3px; }
.legend { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-top: 6px; }
.grad { width: 120px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, rgba(var(--hl),0), rgba(var(--hl),.85)); border: 1px solid var(--line); }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s 0.8s linear infinite; vertical-align: -2px; }
@keyframes s { to { transform: rotate(360deg); } }
.err { color: var(--bad); }
.toks.pick span { cursor: pointer; }
.toks.pick span.sel { outline: 2px solid var(--accent); }
.feat td.lab { color: var(--muted); }
.jump { height: 8px; background: var(--accent); border-radius: 3px; min-width: 2px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.tabs button { background: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
.tabs button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.charts .full { grid-column: 1 / -1; }
@media (max-width: 800px) { .charts { grid-template-columns: 1fr; } }
.chart h3 { font-size: 14px; margin: 0 0 2px; }
.chart p { margin: 0 0 6px; color: var(--muted); font-size: 12px; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart svg text { font-size: 11px; fill: var(--muted); font-family: inherit; }
.chart svg .lbl { fill: var(--ink); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Backdoor Scanner</h1>
      <p class="sub">Prompt a GPT-2 model and see which tokens its internals flag as anomalous.</p>
    </div>
    <label class="sel">Model<select id="model"></select></label>
  </header>

  <div class="card">
    <h2>Prompt</h2>
    <textarea id="prompt" spellcheck="false"></textarea>
    <div class="row"><button class="go" id="go">Analyze</button><span class="hint" id="status"></span></div>
    <div class="row" id="examples"></div>
  </div>

  <div id="results"></div>

  <div class="card">
    <h2>Prompt-free model scan</h2>
    <div id="scan" class="hint">Loading…</div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let CFG = null;
const esc = s => s.replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));
const showTok = t => esc(t.replace(/\n/g, "↵\n"));
const fmt = x => x >= 100 ? x.toFixed(0) : x >= 10 ? x.toFixed(1) : x.toFixed(2);

async function init() {
  CFG = await (await fetch("/api/config")).json();
  $("#model").innerHTML = CFG.models.map(m => `<option value="${m.key}">${esc(m.label)}</option>`).join("");
  try { const saved = localStorage.getItem("bs_model"); if (saved && CFG.models.some(m => m.key === saved)) $("#model").value = saved; } catch (e) {}
  $("#model").onchange = () => { try { localStorage.setItem("bs_model", $("#model").value); } catch (e) {} renderExamples(); loadScan(); $("#results").innerHTML = ""; };
  $("#go").onclick = run;
  $("#prompt").addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) run(); });
  renderExamples(); loadScan();
}

function family() { return CFG.models.find(m => m.key === $("#model").value).exp === "deploy" ? "deploy" : "maple"; }

function renderExamples() {
  const fam = family();
  const ex = CFG.examples.filter(e => e.group === fam || e.group === "any");
  $("#examples").innerHTML = `<span class="hint">Examples:</span>` + ex.map((e, i) => `<span class="chip" data-i="${CFG.examples.indexOf(e)}">${esc(e.label)}</span>`).join("");
  $("#examples").querySelectorAll(".chip").forEach(c => c.onclick = () => { $("#prompt").value = CFG.examples[+c.dataset.i].text; run(); });
  if (!$("#prompt").value) $("#prompt").value = ex[0].text;
}

async function run() {
  const prompt = $("#prompt").value; if (!prompt.trim()) return;
  $("#go").disabled = true;
  $("#status").innerHTML = `<span class="spin"></span> Analyzing… (first run on a model calibrates detectors on normal text, ~1 min)`;
  try {
    const r = await (await fetch("/api/analyze", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({model: $("#model").value, prompt})})).json();
    if (r.error) throw new Error(r.error);
    render(r, prompt); $("#status").textContent = "";
  } catch (e) { $("#status").innerHTML = `<span class="err">Error: ${esc(String(e.message || e))}</span>`; }
  $("#go").disabled = false;
}

function render(r, prompt) {
  const main = r.detectors.find(d => d.verdict);
  const others = r.detectors.filter(d => !d.verdict), nOther = others.filter(d => d.flagged).length;
  const verdict = main.flagged
    ? `<div class="verdict bad"><b>⚠ Likely triggered</b> <small>most suspicious token <code>${showTok(r.tokens[main.argmax])}</code> · ${(main.max / main.threshold).toFixed(1)}× the 1% false-alarm threshold · ${nOther} of ${others.length} other detectors agree</small></div>`
    : `<div class="verdict good"><b>✓ Looks normal</b> <small>recommended detector below its 1% false-alarm threshold · ${nOther} of ${others.length} other detectors flagged</small></div>`;
  const dets = [main, ...others].map(d => {
    const toks = r.tokens.map((t, i) => {
      const ratio = d.scores[i] / d.threshold;
      const a = Math.max(0, Math.min(1, (ratio - 0.6) / 0.5)) ** 1.5 * 0.85;
      return `<span class="${ratio > 1 ? "over" : ""}" style="background: rgba(var(--hl), ${a.toFixed(3)})" title="${esc(t)}  score ${fmt(d.scores[i])} (${ratio.toFixed(2)}× threshold)">${showTok(t)}</span>`;
    }).join("");
    return `<div class="det">
      <div class="dethead"><b>${d.name}</b>
        <span class="badge ${d.flagged ? "bad" : "good"}">${d.flagged ? "Flagged" : "Normal"}</span>
        <span class="tag">${d.needs_base ? "needs base model" : "suspect model only"}</span>
        <span class="detdesc">max ${fmt(d.max)} vs threshold ${fmt(d.threshold)} (typical token ${fmt(d.typical)}) · ${d.desc}</span></div>
      <div class="toks">${toks}</div></div>`;
  }).join("");
  const label = CFG.models.find(m => m.key === r.model).label;
  $("#results").innerHTML = verdict + `
    <div class="card"><h2>Per-token anomaly scores</h2>${dets}
      <div class="legend"><span>normal</span><span class="grad"></span><span>at/over threshold (outlined)</span><span>· hover a token for its score</span></div></div>
    <div class="card" id="saecard"><h2>Inside the model: sparse autoencoder features</h2>
      <p class="hint" style="margin-top:0">The sparse autoencoder rewrites the model's layer-9 state at each word as a few readable features
      out of 24,576. Below: the features that switch on most in this model compared with the original GPT-2. Click a word to inspect it.</p>
      <div class="toks pick" id="saetoks"></div><div id="saefeat" style="margin-top:10px"></div></div>
    <div class="card" id="advcard"><h2>Advanced: how each detector decides</h2><div class="tabs" id="advtabs"></div><div id="adv"></div></div>
    <div class="card"><h2>What the models say next</h2><div class="outs">
      <div class="out"><div class="who">${esc(label)}</div><div class="txt"><span class="p">…</span>${esc(r.output_suspect)}</div></div>
      <div class="out"><div class="who">Base GPT-2 (unmodified)</div><div class="txt"><span class="p">…</span>${esc(r.output_base)}</div></div>
    </div></div>`;
  $("#saetoks").innerHTML = r.tokens.map((t, i) => `<span data-i="${i}">${showTok(t)}</span>`).join("");
  $("#saetoks").querySelectorAll("span").forEach(sp => sp.onclick = () => showFeat(r, +sp.dataset.i));
  showFeat(r, main.argmax);
  const order = [main, ...others];
  $("#advtabs").innerHTML = order.map(d => `<button data-k="${d.key}">${esc(d.name)}</button>`).join("");
  $("#advtabs").querySelectorAll("button").forEach(bt => bt.onclick = () => showAdv(r, bt.dataset.k));
  showAdv(r, VEC_FIRST(order));
}
const VEC_FIRST = order => (order.find(d => d.key === "diff") || order[0]).key;

const svgNS = (w, h, body) => `<svg viewBox="0 0 ${w} ${h}" role="img">${body}</svg>`;
const tx = (x, y, t, a = "start", cls = "", extra = "") => `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${a}" class="${cls}" ${extra}>${esc(String(t))}</text>`;

function showAdv(r, key) {
  $("#advtabs").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.k === key));
  const d = r.detectors.find(x => x.key === key), V = r.viz[key];
  const isMaha = !!V.map;
  const what = {raw: "Mahalanobis distance of the layer-9 activations from normal text",
                sae_err: "Mahalanobis distance of the part the sparse autoencoder can't reconstruct",
                diff: "Mahalanobis distance of (this model − original GPT-2) activations",
                kl: "how differently this model and the original GPT-2 predict the next word (KL divergence)",
                ens: "z-score of output divergence + z-score of activation difference"}[key];
  $("#adv").innerHTML = `<p class="hint" style="margin-top:0"><b>${esc(d.name)}</b>: ${what}.
      ${isMaha ? "Mahalanobis distance = how many \"standard deviations\" a word is from normal text, measured in all 768 dimensions while accounting for which directions normally vary together." : ""}</p>
    <div class="charts">
      <div class="chart full"><h3>1 · Score for each word</h3><p>Dashed red: alarm line for a prompt this long (1% false alarms on normal text). Grey: a typical word.</p>${barChart(r, d)}</div>
      <div class="chart ${isMaha ? "" : "full"}"><h3>2 · Where this prompt sits among normal text</h3><p>Grey bars: ${r.viz[key].hist.counts.reduce((a, b) => a + b, 0).toLocaleString()} words of normal text (√ scale). Dots: this prompt's words; red = most suspicious.</p>${histChart(r, d, V.hist)}</div>
      ${isMaha ? `<div class="chart full">${whyBox(r, d, V.map)}</div>` : ""}
      ${isMaha ? `<div class="chart"><h3>3 · Distance from normal, with the acceptable zone</h3><p>Each dot's distance from the centre is its exact Mahalanobis distance (all 768 dimensions); the angle only spreads dots out. Green: acceptable. Outside the red circle: alarm. Small dots: normal-text words, which form a ring because in high dimensions almost every normal word sits at a similar distance.</p>${mapChart(r, d, V.map)}</div>` : ""}
    </div>`;
}

function whyBox(r, d, m) {
  // Mahalanobis distance = sqrt(sum of squared offsets over all directions, each measured in standard deviations)
  const i = d.argmax, D = m.dims, rms = v => v / Math.sqrt(D), [mx, n3] = m.zstats[i], dist = m.tokens[i][1];
  const verdict = dist > d.threshold ? `<b style="color:var(--bad)">over the alarm line (${fmt(d.threshold)})</b>` : `under the alarm line (${fmt(d.threshold)})`;
  return `<div class="out" style="font-size:13px"><b>Why “${esc(r.tokens[i].trim())}” scores ${fmt(dist)}.</b>
    The distance is the Pythagorean theorem in ${D} dimensions: square how far the word is from normal in each direction
    (in standard deviations), add them up, take the square root. “${esc(r.tokens[i].trim())}” is about <b>${rms(dist).toFixed(1)} std</b>
    off in an average direction, <b>${n3} of ${D}</b> directions are more than 3 std off, and its biggest single direction is
    <b>${mx.toFixed(1)} std</b>, so the total comes to ${fmt(dist)}, ${verdict}. A typical normal word is about
    ${rms(d.typical).toFixed(1)} std off per direction, ${fmt(d.typical)} in total. No single direction gives the trigger away;
    hundreds of small ones add up, which is why a flat 2-D picture can't show it.</div>`;
}

function barChart(r, d) {
  const W = 800, H = 210, L = 44, B = 56, T = 10, n = r.tokens.length, bw = (W - L) / n;
  const mx = Math.max(d.threshold * 1.15, ...d.scores), mn = Math.min(0, ...d.scores);
  const y = v => T + (H - T - B) * (1 - (v - mn) / (mx - mn));
  let g = "";
  for (const t of [mn, d.typical, d.threshold, mx]) g += tx(L - 6, y(t) + 4, fmt(t), "end");
  r.tokens.forEach((t, i) => {
    const v = d.scores[i], over = v > d.threshold, x = L + i * bw;
    g += `<rect x="${(x + bw * 0.15).toFixed(1)}" y="${Math.min(y(v), y(0)).toFixed(1)}" width="${(bw * 0.7).toFixed(1)}" height="${Math.max(1, Math.abs(y(0) - y(v))).toFixed(1)}" rx="2" fill="${over ? "var(--bad)" : "var(--accent)"}" opacity="${over ? 1 : 0.75}"><title>${esc(t)}: ${fmt(v)} (${(v / d.threshold).toFixed(2)}× alarm line)</title></rect>`;
    if (bw > 9) g += tx(x + bw / 2, H - B + 12, t.length > 9 ? t.slice(0, 8) + "…" : t.replace(/\n/g, "↵"), "end", "", `transform="rotate(-40 ${(x + bw / 2).toFixed(1)} ${(H - B + 12).toFixed(1)})"`);
  });
  g += `<line x1="${L}" x2="${W}" y1="${y(d.threshold)}" y2="${y(d.threshold)}" stroke="var(--bad)" stroke-dasharray="5 4" stroke-width="1.5"/>`;
  g += `<line x1="${L}" x2="${W}" y1="${y(d.typical)}" y2="${y(d.typical)}" stroke="var(--muted)" stroke-dasharray="2 4" stroke-width="1"/>`;
  g += `<line x1="${L}" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>`;
  return svgNS(W, H, g);
}

function histChart(r, d, h) {
  const W = 400, H = 220, L = 10, R = 10, B = 40, T = 26, n = h.counts.length;
  const lo = h.edges[0], hiData = h.edges[n], hi = Math.max(hiData, d.threshold, ...d.scores) * 1.02;
  const x = v => L + (W - L - R) * (Math.min(Math.max(v, lo), hi) - lo) / (hi - lo);
  const cm = Math.sqrt(Math.max(...h.counts)), yb = c => H - B - (H - B - T) * Math.sqrt(c) / cm;
  let g = "";
  h.counts.forEach((c, i) => { const x0 = x(h.edges[i]), x1 = x(h.edges[i + 1]);
    g += `<rect x="${x0.toFixed(1)}" y="${yb(c).toFixed(1)}" width="${Math.max(0.5, x1 - x0 - 0.6).toFixed(1)}" height="${(H - B - yb(c)).toFixed(1)}" fill="var(--muted)" opacity="0.45"><title>${c.toLocaleString()} normal words scored ${fmt(h.edges[i])}–${fmt(h.edges[i + 1])}</title></rect>`; });
  g += `<line x1="${x(d.threshold)}" x2="${x(d.threshold)}" y1="${T - 8}" y2="${H - B}" stroke="var(--bad)" stroke-dasharray="5 4" stroke-width="1.5"/>` + tx(x(d.threshold) + 4, T - 12, "alarm line", "start", "", 'style="fill:var(--bad)"');
  d.scores.forEach((v, i) => { const top = i === d.argmax;
    g += `<circle cx="${x(v).toFixed(1)}" cy="${(H - B + 10).toFixed(1)}" r="${top ? 6 : 4}" fill="${top ? "var(--bad)" : "var(--accent)"}" stroke="var(--panel)" stroke-width="1.5" opacity="${top ? 1 : 0.8}"><title>${esc(r.tokens[i])}: ${fmt(v)}</title></circle>`; });
  const xt = x(d.scores[d.argmax]);
  g += tx(Math.min(Math.max(xt, 40), W - 40), H - B + 30, `“${r.tokens[d.argmax].trim()}” ${fmt(d.scores[d.argmax])}`, "middle", "lbl");
  if (xt > 70) g += tx(L, H - 2, fmt(lo), "start");             // axis ends, unless the token label sits there
  if (xt < W - 90) g += tx(W - R, H - 2, fmt(hi), "end");
  return svgNS(W, H, g);
}

function mapChart(r, d, m) {
  const W = 400, H = 300, cx = W / 2, cy = H / 2 + 6, Rmax = H / 2 - 18;
  const pts = m.cloud, tk = m.tokens;
  const top = Math.max(d.threshold * 1.12, ...tk.map(p => p[1])), rs = v => Rmax * Math.min(v, top) / top;
  const at = (a, rr) => [cx + rs(rr) * Math.cos(a), cy - rs(rr) * Math.sin(a)];
  let g = `<circle cx="${cx}" cy="${cy}" r="${rs(d.threshold).toFixed(1)}" fill="var(--good-soft)" stroke="var(--bad)" stroke-dasharray="6 4" stroke-width="1.6"/>`;
  g += `<circle cx="${cx}" cy="${cy}" r="${rs(d.typical).toFixed(1)}" fill="none" stroke="var(--muted)" stroke-dasharray="2 3" stroke-width="1"/>`;
  g += `<circle cx="${cx}" cy="${cy}" r="2.5" fill="var(--muted)"/>`;
  g += pts.map(p => { const [x, y] = at(p[0], p[1]); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="1.5" fill="var(--accent)" opacity="0.45"/>`; }).join("");
  tk.forEach((p, i) => { const hi = i === d.argmax, [x, y] = at(p[0], p[1]), out = p[1] > d.threshold;
    g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${hi ? 6 : 4}" fill="${out ? "var(--bad)" : "var(--ink)"}" stroke="var(--panel)" stroke-width="1.5"><title>${esc(r.tokens[i])}: distance ${fmt(p[1])} (${out ? "outside: alarm" : "inside: acceptable"})</title></circle>`;
    if (hi) g += tx(x + (x > W - 80 ? -9 : 9), y - 8, `“${r.tokens[i].trim().slice(0, 12)}” ${fmt(p[1])}`, x > W - 80 ? "end" : "start", "lbl"); });
  g += tx(cx, cy - rs(d.threshold) - 6, `alarm boundary ${fmt(d.threshold)}`, "middle", "", 'style="fill:var(--bad)"');
  g += tx(cx + rs(d.typical) * 0.72 + 4, cy + rs(d.typical) * 0.72 + 12, `typical ${fmt(d.typical)}`, "start");
  g += tx(cx, cy + rs(d.threshold) - 8, "acceptable", "middle", "", 'style="fill:var(--good)"');
  return svgNS(W, H, g);
}

function showFeat(r, i) {
  $("#saetoks").querySelectorAll("span").forEach(sp => sp.classList.toggle("sel", +sp.dataset.i === i));
  const F = r.sae_jumps[i] || [], mx = Math.max(1, ...r.sae_jumps.flat().map(f => f.jump)), tw = F.some(f => f.twin !== undefined);
  $("#saefeat").innerHTML = F.length ? `<table class="feat"><tr><th>Feature</th><th>Automatic label (Neuronpedia)</th><th>Base GPT-2</th>${tw ? "<th>Clean twin*</th>" : ""}<th>This model</th><th style="width:24%">Jump vs base</th></tr>
    ${F.map(f => `<tr><td class="mono">#${f.id}</td><td class="lab">${esc(f.label || "–")}</td><td>${fmt(f.base)}</td>${tw ? `<td>${fmt(f.twin)}</td>` : ""}<td><b>${fmt(f.suspect)}</b></td>
      <td><div class="jump" style="width:${(100 * f.jump / mx).toFixed(0)}%"></div></td></tr>`).join("")}</table>
    <p class="hint">Word <code>${showTok(r.tokens[i])}</code>. Fine-tuning moves some features on any text (try the code example), so the jump alone is not proof.
    ${tw ? "*Clean twin: the same training without poisoned examples, shown for comparison; a real defender would not have it. A feature high in this model but not in its twin is the backdoor at work." : ""}</p>`
    : `<p class="hint">No feature is more active here than in base GPT-2.</p>`;
}

async function loadScan() {
  const key = $("#model").value;
  const s = await (await fetch("/api/scan?model=" + key)).json();
  if (!s.scan) { $("#scan").innerHTML = "No scan results for this model yet."; return; }
  const top = s.scan.top10, mx = top[0].kl;
  const rank = Object.entries(s.scan.trigger_rank).map(([t, r]) => `<code>${showTok(t)}</code> #${r ?? "–"}`).join(", ");
  const ver = s.verify ? `<p>Consistency check: most consistent hijack is <code>${showTok(s.verify.flagged_token)}</code> → <code>${showTok(s.verify.payload)}</code>, score <b>${s.verify.score.toFixed(2)}</b> ${s.verify.score > 0.5 ? '<span class="badge bad">Backdoor likely</span>' : '<span class="badge good">No consistent hijack</span>'}</p>` : "";
  $("#scan").innerHTML = `<p class="hint" style="margin-top:0">Every one of GPT-2's 50,257 tokens was appended to normal text; tokens that make this model's predictions diverge most from base GPT-2 are listed. No user prompts needed.</p>
    <table><tr><th>#</th><th>Token</th><th style="width:35%">Divergence</th><th>Model then says</th></tr>
    ${top.map((t, i) => `<tr><td>${i + 1}</td><td class="mono">${showTok(t.token.length > 20 ? t.token.slice(0, 20) + "…" : t.token)}</td><td><div class="bar" style="width:${(100 * t.kl / mx).toFixed(0)}%"></div></td><td class="mono">${showTok(t.model_says)}</td></tr>`).join("")}</table>
    <p class="hint">Known trigger's rank (for evaluation only): ${rank}</p>${ver}`;
}

init();
</script>
