<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPT-2 Chat</title>
<style>
:root { --bg: #ffffff; --ink: #16181d; --muted: #6b7280; --line: #e5e7eb; --me: #2f5bd3; --me-ink: #ffffff; --bot: #f1f3f5; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #131417; --ink: #e8eaee; --muted: #9aa2ae; --line: #2a2e35; --me: #4f74e8; --me-ink: #ffffff; --bot: #22252b; }
}
:root[data-theme="dark"] { --bg: #131417; --ink: #e8eaee; --muted: #9aa2ae; --line: #2a2e35; --me: #4f74e8; --me-ink: #ffffff; --bot: #22252b; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; display: flex; flex-direction: column; }
header { border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; justify-content: center; }
select { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; max-width: 100%; }
#log { flex: 1; overflow-y: auto; padding: 20px 16px; }
.inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 80%; padding: 9px 13px; border-radius: 16px; white-space: pre-wrap; word-break: break-word; }
.me { align-self: flex-end; background: var(--me); color: var(--me-ink); border-bottom-right-radius: 4px; }
.bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
.bot .who { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
.typing { color: var(--muted); }
form { border-top: 1px solid var(--line); padding: 12px 16px; }
.bar { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; }
input { flex: 1; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 22px; padding: 10px 16px; min-width: 0; }
button { font: inherit; border: 0; border-radius: 22px; padding: 0 18px; background: var(--me); color: var(--me-ink); font-weight: 600; cursor: pointer; }
button:disabled { opacity: .5; }
</style>
</head>
<body>
<header><select id="model" aria-label="Model"></select></header>
<div id="log"><div class="inner" id="msgs"></div></div>
<form id="f"><div class="bar"><input id="in" autocomplete="off" placeholder="Message" autofocus><button id="send">Send</button></div></form>
<script>
const $ = s => document.querySelector(s);
const add = (cls, text, who) => {
  const d = document.createElement("div"); d.className = "msg " + cls;
  if (who) { const w = document.createElement("div"); w.className = "who"; w.textContent = who; d.appendChild(w); }
  const t = document.createElement("div"); t.textContent = text; d.appendChild(t);
  $("#msgs").appendChild(d); $("#log").scrollTop = $("#log").scrollHeight; return t;
};
fetch("/api/models").then(r => r.json()).then(ms => {
  $("#model").innerHTML = ms.map(m => `<option value="${m.key}">${m.label}</option>`).join("");
  try { const s = localStorage.getItem("chat_model"); if (s && ms.some(m => m.key === s)) $("#model").value = s; } catch (e) {}
});
$("#model").onchange = () => { try { localStorage.setItem("chat_model", $("#model").value); } catch (e) {} };
$("#f").onsubmit = async e => {
  e.preventDefault();
  const msg = $("#in").value.trim(); if (!msg) return;
  const who = $("#model").selectedOptions[0].textContent;
  $("#in").value = ""; $("#send").disabled = true;
  add("me", msg);
  const t = add("bot typing", "…", who);
  try {
    const r = await (await fetch("/api/chat", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({model: $("#model").value, message: msg})})).json();
    t.textContent = r.reply ?? ("Error: " + r.error); t.parentElement.classList.remove("typing");
  } catch (err) { t.textContent = "Error: " + err; }
  $("#send").disabled = false; $("#in").focus();
};
</script>
</body>
</html>
