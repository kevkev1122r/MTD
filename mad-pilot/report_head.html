<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backdoor Pilot Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F4F6F7;--surface:#FFFFFF;--ink:#15202B;--muted:#56636F;--line:#DCE2E6;
  --accent:#0B7A83;--accent-soft:#DDEFF0;--hot:#C4432B;--hot-soft:#F7E2DC;--warn:#8A5A06;--warn-soft:#F6EBD3;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Public Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1316;--surface:#161D22;--ink:#E3E9ED;--muted:#97A5AF;--line:#27323B;
    --accent:#4DB6BF;--accent-soft:#12303A;--hot:#EE7B62;--hot-soft:#3A201A;--warn:#E0A43B;--warn-soft:#352812;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1316;--surface:#161D22;--ink:#E3E9ED;--muted:#97A5AF;--line:#27323B;
  --accent:#4DB6BF;--accent-soft:#12303A;--hot:#EE7B62;--hot-soft:#3A201A;--warn:#E0A43B;--warn-soft:#352812;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;padding-inline:16px;padding-block:0 72px}
.wrap{max-width:820px;margin:0 auto}
header.top{padding-block:40px 8px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,6vw,44px);line-height:1.08;margin:0 0 14px;letter-spacing:-.01em;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.tag{font-family:var(--mono);font-size:12px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;color:var(--muted)}
.tag.due{border-color:var(--hot);color:var(--hot)}
.q{font-family:var(--display);font-weight:600;font-size:clamp(19px,3.2vw,23px);line-height:1.35;margin:0;padding:18px 20px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:0;text-wrap:balance}
nav.toc{display:flex;gap:6px;overflow-x:auto;padding-block:18px 4px;scrollbar-width:none}
nav.toc a{flex:none;font-size:13px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;white-space:nowrap}
nav.toc a:hover{border-color:var(--accent);color:var(--accent)}
a{color:var(--accent)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section{padding-top:40px;scroll-margin-top:12px}
.sh{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:14px}
.sh .n{font-family:var(--mono);font-size:13px;color:var(--accent)}
.sh h2{font-family:var(--display);font-weight:700;font-size:24px;margin:0;line-height:1.2}
h3{font-family:var(--display);font-weight:600;font-size:18px;margin:22px 0 8px}
p{margin:0 0 12px;max-width:68ch}
.muted{color:var(--muted)}
ul{margin:0 0 12px;padding-left:20px}
li{margin-bottom:4px;max-width:66ch}
code{font-family:var(--mono);font-size:.88em;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.tbl{overflow-x:auto;margin:6px 0 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:560px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
tr:last-child td{border-bottom:0}
td.k{font-family:var(--mono);font-size:13.5px;white-space:nowrap}
.hyp{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin:6px 0 14px}
.hyp div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.hyp b{font-family:var(--mono);font-weight:500;color:var(--accent);display:block;font-size:13px;margin-bottom:4px}
.hyp p{margin:0;font-size:15px}
.hyp .test{color:var(--muted);font-size:13.5px;margin-top:6px}
.chip{display:inline-block;font-family:var(--body);font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px;white-space:nowrap}
.c-core{background:var(--accent-soft);color:var(--accent)}
.c-stretch{background:var(--warn-soft);color:var(--warn)}
.c-cut{background:var(--hot-soft);color:var(--hot)}
.weeks{list-style:none;padding:0;margin:6px 0 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.weeks li{display:grid;grid-template-columns:118px minmax(0,1fr);gap:4px 16px;padding:12px 14px;border-bottom:1px solid var(--line);margin:0;max-width:none}
.weeks li:last-child{border-bottom:0}
.weeks .d{font-family:var(--mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.weeks .t{font-weight:600}
.weeks .x{color:var(--muted);font-size:14.5px}
.weeks .done{font-size:13.5px;margin-top:2px}
.weeks .done::before{content:"Done when: ";color:var(--accent);font-weight:600}
.weeks li.gate{background:var(--accent-soft)}
@media (max-width:560px){.weeks li{grid-template-columns:1fr}}
.note{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:14px 16px;margin:6px 0 14px;font-size:15px}
.note b{color:var(--warn)}
pre.mermaid{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;overflow-x:auto;margin:6px 0 14px}
.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.box h4{font-family:var(--mono);font-weight:500;font-size:13px;color:var(--muted);margin:0 0 6px;text-transform:uppercase;letter-spacing:.05em}
.box ul{margin:0}
footer{color:var(--muted);font-size:13.5px;margin-top:44px;border-top:1px solid var(--line);padding-top:16px}
</style>
<style>.fig img{width:100%;height:auto;border:1px solid var(--line);border-radius:10px;background:#fff}.fig p{font-size:14px;color:var(--muted);margin-top:6px}.big{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.1}.kpi{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin:10px 0 16px}.kpi div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}.kpi span{display:block;font-size:13px;color:var(--muted)}</style>
